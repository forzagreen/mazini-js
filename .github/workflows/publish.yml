name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — npm trusted publishing + provenance (no NPM_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm install -g npm@latest # trusted publishing and `npm stage` need a recent npm
      - name: Skip a version that is already on npm
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "mazini@$v" version >/dev/null 2>&1; then
            echo "mazini@$v is already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Staged publishing: the tarball is uploaded but not released until a
      # maintainer approves it with 2FA (`npm stage list`, then
      # `npm stage approve <stage-id>`), so a compromised workflow cannot ship
      # a release on its own. The npm trusted publisher is configured as
      # "staged publishing only".
      - if: steps.check.outputs.skip != 'true'
        run: npm stage publish
