name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — npm trusted publishing + provenance (no NPM_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Skip a version that is already on npm
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "mazini@$v" version >/dev/null 2>&1; then
            echo "mazini@$v is already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish
